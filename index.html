<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code 8 Drill — ระบบประเมินและวิเคราะห์ผล | Bangkok Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --navy:#0F2A5F; --navy2:#1C3F86; --red:#D7262E; --red-soft:#FDECEC;
  --ink:#0F172A; --ink2:#334155; --mute:#64748B; --line:#E2E8F0; --bg:#F4F6FA; --card:#FFFFFF;
  --pass:#15803D; --pass-soft:#DCFCE7; --warn:#B45309; --warn-soft:#FEF3C7; --fail:#B91C1C; --fail-soft:#FEE2E2;
  --opd:#2563EB; --ipd:#7C3AED; --ccd:#D7262E;
  --r:14px; --sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Sarabun','Leelawadee UI','Tahoma',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--navy2)}
.wrap{max-width:1280px;margin:0 auto;padding:0 18px}

/* ---------- header ---------- */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.logo{background:#fff;border-radius:10px;padding:5px 9px;display:flex;align-items:center}
.logo img{height:30px;display:block}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
.brand p{margin:0;font-size:12.5px;opacity:.8}
.top .sp{flex:1}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl label{font-size:12px;opacity:.85}
.ctl select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:9px;padding:6px 10px;font-weight:600}
.ctl select option{color:var(--ink)}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:9px;overflow:hidden}
.seg button{background:none;border:0;color:#fff;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600;opacity:.75}
.seg button.on{background:#fff;color:var(--navy);opacity:1}
.net{font-size:12.5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);white-space:nowrap;cursor:pointer}
.net b{font-weight:700}

/* ---------- tabs ---------- */
.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:30}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:13px 14px 11px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-size:14.5px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--navy);border-bottom-color:var(--red)}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;border-radius:999px;background:var(--red-soft);color:var(--red);font-size:12px}

main{padding:20px 0 60px}
.pane{display:none}.pane.on{display:block}

/* ---------- generic ---------- */
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px}
.card h3{margin:0 0 2px;font-size:16px}
.card .sub{margin:0 0 12px;color:var(--mute);font-size:13px}
.sec-h{display:flex;align-items:flex-end;gap:12px;margin:22px 0 10px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:19px}
.sec-h p{margin:0;color:var(--mute);font-size:13.5px}
.sec-h .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn:hover{border-color:#CBD5E1;background:#F8FAFC}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--navy2)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-pass{background:var(--pass-soft);color:var(--pass)}
.b-fail{background:var(--fail-soft);color:var(--fail)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-mute{background:#EEF2F7;color:var(--mute)}
.b-opd{background:#DBEAFE;color:var(--opd)}.b-ipd{background:#EDE9FE;color:var(--ipd)}.b-ccd{background:var(--red-soft);color:var(--ccd)}
.crit{color:var(--red);font-weight:700}
.muted{color:var(--mute)}
.small{font-size:12.5px}
.note{background:#F1F5FB;border:1px solid #DCE5F3;border-radius:10px;padding:10px 13px;font-size:13.5px;color:var(--ink2)}
.note.warn{background:var(--warn-soft);border-color:#FCD34D;color:#78350F}
.empty{padding:28px;text-align:center;color:var(--mute)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select.inp,textarea{
  width:100%;border:1px solid #CBD5E1;border-radius:9px;padding:8px 10px;background:#fff;outline:none}
input:focus,select.inp:focus,textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(28,63,134,.12)}
textarea{min-height:64px;resize:vertical}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.fld .hint{font-size:12px;color:var(--mute);margin-top:3px}

/* ---------- KPI tiles ---------- */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .l{font-size:12.5px;color:var(--mute);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:600;color:var(--mute)}
.kpi .d{font-size:12.5px;color:var(--ink2);margin-top:2px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,var(--navy))}

/* ---------- charts ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:2px 0 6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(120px,38%) 1fr 54px;gap:8px;align-items:center;font-size:13.5px;padding:4px 0}
.hb .bar{height:12px;background:#EEF2F7;border-radius:6px;overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:6px}
.hb .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{background:#F8FAFC;text-align:left;font-weight:700;color:var(--ink2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid #EEF2F7;vertical-align:top}
.tbl tr:hover td{background:#FAFBFD}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.c,.tbl th.c{text-align:center}
.heat{display:inline-block;min-width:46px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- unit cards ---------- */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.unit{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;border-left:4px solid var(--c,#CBD5E1);transition:transform .08s}
.unit:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.unit .n{font-weight:700;font-size:14px;line-height:1.3}
.unit .rs{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.unit .r{font-size:12px;border-radius:6px;padding:1px 6px;background:#F1F5F9;font-weight:600;font-variant-numeric:tabular-nums}
.unit .st{margin-top:7px}

/* ---------- form ---------- */
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dom{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-top:14px;overflow:hidden;box-shadow:var(--sh)}
.dom-h{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;border-left:5px solid var(--dc)}
.dom-h .t{font-weight:700}
.dom-h .s{font-size:12.5px;color:var(--mute)}
.dom-h .sc{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;color:var(--dc)}
.item{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:start;padding:11px 16px;border-top:1px solid #EEF2F7}
.item.miss{background:#FFF7ED}
.item .no{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;padding-top:3px}
.item .tx{font-size:14.5px}
.item .tx .cr{color:var(--red);font-size:12px;font-weight:700;margin-left:6px;white-space:nowrap}
.item details{margin-top:4px}
.item summary{font-size:12.5px;color:var(--navy2);cursor:pointer;font-weight:600;list-style:none}
.item summary::-webkit-details-marker{display:none}
.crit-box{font-size:13px;margin-top:6px;display:grid;gap:5px}
.crit-box div{padding:6px 9px;border-radius:8px}
.crit-box .p{background:#F0FDF4;color:#14532D}
.crit-box .f{background:#FEF2F2;color:#7F1D1D}
.crit-box .c{background:#FFF1F2;color:#881337;border:1px dashed #FDA4AF}
.ans{display:flex;gap:5px}
.ans button{border:1.5px solid #CBD5E1;background:#fff;border-radius:9px;padding:7px 10px;font-weight:700;cursor:pointer;min-width:62px;font-size:13.5px}
.ans button.p.on{background:var(--pass);border-color:var(--pass);color:#fff}
.ans button.f.on{background:var(--fail);border-color:var(--fail);color:#fff}
.ans button.n.on{background:#64748B;border-color:#64748B;color:#fff}
.ans button:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:640px){.item{grid-template-columns:38px 1fr}.ans{grid-column:1/-1}.ans button{flex:1}}
.scorebar{position:sticky;bottom:0;z-index:25;background:var(--navy);color:#fff;border-radius:14px 14px 0 0;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:18px;box-shadow:0 -6px 18px rgba(15,23,42,.18)}
.scorebar .blk{display:flex;flex-direction:column;line-height:1.25}
.scorebar .blk .l{font-size:11.5px;opacity:.75}
.scorebar .blk .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.scorebar .sp{flex:1}
.scorebar .btn{border-color:rgba(255,255,255,.4)}
.assr{display:grid;grid-template-columns:1fr 1fr 34px;gap:6px;margin-bottom:6px}
.editbar{background:var(--warn-soft);border:1px solid #FCD34D;color:#78350F;border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scn{background:#FFF7F7;border:1px solid #FBD5D5;border-radius:12px;padding:12px 14px;margin-top:12px}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:24px 12px;overflow:auto}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:920px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:17px;flex:1}
.modal .mb{padding:16px 18px;max-height:calc(100vh - 170px);overflow:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}

/* ---------- report (detail + print) ---------- */
.rep h2{margin:0;font-size:18px}
.rep .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 14px;font-size:13.5px;margin:10px 0}
.rep .meta b{color:var(--ink2)}
.rep table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.rep th,.rep td{border:1px solid #E2E8F0;padding:5px 8px;text-align:left}
.rep th{background:#F1F5F9}
.rep .ok{color:var(--pass);font-weight:700}.rep .no{color:var(--fail);font-weight:700}.rep .na{color:var(--mute)}

footer{border-top:1px solid var(--line);background:#fff;padding:14px 0;font-size:12.5px;color:var(--mute)}
footer .wrap{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}

/* ---------- guide / print ---------- */
.guide h2{font-size:20px;margin:6px 0 6px}
.guide h3{font-size:16px;margin:18px 0 6px;color:var(--navy)}
.guide table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 10px;background:#fff}
.guide th,.guide td{border:1px solid #CBD5E1;padding:6px 8px;vertical-align:top;text-align:left}
.guide th{background:#EEF2F8}
.guide .box3{display:inline-block;width:13px;height:13px;border:1.5px solid #475569;border-radius:3px}
.guide ul{margin:4px 0 8px;padding-left:20px}
.print-only{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:11.5px}
  .top,.tabs,footer,.no-print,.scorebar,.toast{display:none!important}
  main{padding:0}
  .pane{display:none!important}
  .pane.print{display:block!important}
  .card,.kpi{box-shadow:none}
  .print-only{display:block}
  .guide table{page-break-inside:auto}
  .guide tr{page-break-inside:avoid}
  .guide h3{page-break-after:avoid}
}
@media(max-width:760px){
  .top{position:static}
  .top .wrap{min-height:0;gap:8px}
  .brand p{display:none}
  .tabs{top:0}
  .scorebar{gap:10px;padding:8px 12px}
  .scorebar .blk.opt{display:none}
  .scorebar .blk .v{font-size:15px}
  .scorebar .sp{display:none}
  .scorebar #fReset{display:none}
  .scorebar #fSave{flex:1;justify-content:center}
}

/* ---------- follow-up & compare ---------- */
.trc{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.follow{background:#FFFBEB;border:1px solid #FCD34D;border-radius:12px;padding:10px 14px;margin-top:12px}
.prev-adv{font-size:12.5px;background:#FFFBEB;border-left:3px solid #F59E0B;padding:4px 8px;border-radius:4px;margin-top:5px;color:#78350F}
.item.was-fail{background:#FFFDF5}
input.adv{margin-top:6px;border-color:#FCA5A5;background:#FFF7F7;font-size:13.5px}
.ucmps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ucmp{background:#fff;border:1.5px solid #E2E8F0;border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:var(--sh)}
.ucmp.ok{border-color:#86EFAC;background:#FAFFFB}.ucmp.ng{border-color:#FCA5A5;background:#FFFAFA}
.ucmp:hover{transform:translateY(-1px)}
.rboxes{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.rbox{text-align:center}.rbox .rl{font-size:11.5px;color:var(--mute)}
.rbox .rv{font-size:19px;font-weight:800;border:1.5px solid;border-radius:10px;padding:3px 10px;margin:2px 0;font-variant-numeric:tabular-nums}
.rbox .rs{font-size:11.5px;font-weight:700}
.arr{color:#94A3B8;font-size:18px}
.rep-h{font-size:15px;margin:16px 0 4px;color:var(--navy)}
.sign{display:flex;justify-content:space-around;align-items:flex-end;margin-top:30px;text-align:center;page-break-inside:avoid}
.sign-col{min-width:240px}
.sign .sn{font-weight:700;font-size:13.5px;margin-top:6px}.sign .sr{font-size:12px;color:#334155}
.sign .sc{font-size:12px;color:#64748B;margin-top:8px}
.sign .sline{border-bottom:1px solid #94A3B8;height:60px;margin:0 20px}
.rep-foot{margin-top:16px;background:#FFF7ED;border-left:4px solid #F59E0B;padding:8px 12px;border-radius:6px;font-size:12px;color:#7C2D12}
</style>
</head>
<body>

function scoreSet(items,ans){
  let e=0,m=0,na=0,answered=0; const crit=[],doms={},naItems=[];

  for(const it of items){ const a=ans&&ans[it.k]; const d=doms[it.d]||(doms[it.d]={e:0,m:0});

    else if(a==='na'){na++;answered++;naItems.push(it.k);}

  let acls=null;

/* up = เคยไม่ผ่าน→ผ่าน · keep = ผ่าน→ผ่าน · still = ไม่ผ่าน→ไม่ผ่าน · down = ผ่าน→ไม่ผ่าน (ถดถอย) */
function compareRecs(a,b){ const o={up:[],keep:[],still:[],down:[]};
  itemsFor(a,b).forEach(it=>{ const x=ansOf(a,it.k), y=ansOf(b,it.k);

function cleanForCloud(r){ const o=Object.assign({},r); delete o._docId; delete o.attachments; delete o._pending; return o; }
function initFB(){
  try{
    if(!window.firebase||!firebase.firestore) throw new Error('Firebase SDK not loaded');
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    S.db=firebase.firestore();
    S.db.collection(COLLECTION).onSnapshot(snap=>{
      S.all=snap.docs.map(d=>Object.assign({},d.data(),{_docId:d.id}));
      S.online=true; S.lastSync=new Date();
      overlayQueue(); lsSet(LS.cache,{t:Date.now(),recs:S.all.map(cleanForCacheRec)}); onData();
    },err=>{ console.error(err); S.online=false; setNet(); toast('⚠️ เชื่อมต่อฐานข้อมูลไม่ได้ — แสดงข้อมูลที่เก็บไว้ในเครื่อง'); });
  }catch(e){ console.warn(e); S.online=false; setNet(); }
}
function cleanForCacheRec(r){ const o=Object.assign({},r); delete o.attachments; return o; }
function overlayQueue(){
  const q=lsGet(LS.queue,[]), dq=lsGet(LS.delq,[]);
  for(const rec of q){ const i=S.all.findIndex(x=>String(x.id)===String(rec.id)); const v=Object.assign({},rec,{_docId:String(rec.id),_pending:true});
    if(i>=0) S.all[i]=v; else S.all.push(v); }
  if(dq.length) S.all=S.all.filter(x=>dq.indexOf(String(x._docId||x.id))<0);
}
function queueSet(rec){ const q=lsGet(LS.queue,[]).filter(x=>String(x.id)!==String(rec.id)); q.push(cleanForCloud(rec)); lsSet(LS.queue,q); }
function queueDrop(id){ lsSet(LS.queue,lsGet(LS.queue,[]).filter(x=>String(x.id)!==String(id))); }
function writeRec(rec){
  rec._savedAt=new Date().toISOString();
  queueSet(rec);
  const i=S.all.findIndex(x=>String(x.id)===String(rec.id)); const local=Object.assign({},rec,{_docId:String(rec.id),_pending:true});
  if(i>=0) S.all[i]=local; else S.all.push(local);
  onData();
  if(!S.db||!navigator.onLine){ toast('📴 บันทึกในเครื่องแล้ว — จะซิงก์อัตโนมัติเมื่อออนไลน์'); return Promise.resolve(false); }
  return S.db.collection(COLLECTION).doc(String(rec.id)).set(cleanForCloud(rec))
    .then(()=>{ queueDrop(rec.id); setNet(); return true; })
    .catch(err=>{ console.error(err); toast('⚠️ ซิงก์ไม่สำเร็จ — เก็บเข้าคิวแล้ว จะลองใหม่อัตโนมัติ'); setNet(); return false; });
}
function deleteRec(r){
  const id=String(r._docId||r.id);
  const tr=lsGet(LS.trash,[]); tr.unshift(Object.assign({},cleanForCloud(r),{_deletedAt:Date.now()})); lsSet(LS.trash,tr.slice(0,100));
  S.all=S.all.filter(x=>String(x._docId||x.id)!==id); queueDrop(r.id); onData();
  if(!S.db||!navigator.onLine){ const dq=lsGet(LS.delq,[]); dq.push(id); lsSet(LS.delq,dq); toast('ลบในเครื่องแล้ว — จะลบบน Cloud เมื่อออนไลน์'); return; }
  S.db.collection(COLLECTION).doc(id).delete().then(()=>toast('🗑 ลบแล้ว (กู้คืนได้จากถังขยะในหน้า ข้อมูล)')).catch(e=>toast('⚠️ ลบบน Cloud ไม่สำเร็จ: '+e.message));
}
function flushQueue(manual){
  const q=lsGet(LS.queue,[]), dq=lsGet(LS.delq,[]);
  if(!q.length&&!dq.length){ if(manual) toast('✅ ไม่มีรายการค้าง ข้อมูลซิงก์ครบแล้ว'); return; }
  if(!S.db||!navigator.onLine){ if(manual) toast('📴 ยังออฟไลน์ — จะซิงก์ให้อัตโนมัติเมื่อกลับมาออนไลน์'); return; }
  q.forEach(rec=>S.db.collection(COLLECTION).doc(String(rec.id)).set(rec).then(()=>{queueDrop(rec.id);setNet();}).catch(()=>{}));
  dq.forEach(id=>S.db.collection(COLLECTION).doc(id).delete().then(()=>{lsSet(LS.delq,lsGet(LS.delq,[]).filter(x=>x!==id));setNet();}).catch(()=>{}));

const inGrp=(r,g=S.grp)=>g==='ALL'||unitGroup(r.ward)===g;
function unitMap(pool){
  const m={};
  for(const r of pool){
    const u=canonUnit(r.ward), k=wkey(u), rn=rRound(r), d=(r.date||'')+' '+(r.time||'');
    const e=m[k]||(m[k]={k,name:u,group:unitGroup(u),setting:unitSetting(u),rounds:{},recs:[],_d:''});
    e.recs.push(r);
    const cur=e.rounds[rn]; if(!cur||d>=((cur.date||'')+' '+(cur.time||''))) e.rounds[rn]=r;
    if(d>=e._d){ e._d=d; if(!CCD_SET[k]) e.name=String(r.ward||u).trim(); }
  }
  const closed=S.year<new Date().getFullYear();
  for(const e of Object.values(m)){
    e.ns=Object.keys(e.rounds).map(Number).sort((a,b)=>a-b); e.last=e.ns[e.ns.length-1];
    e.lastRec=e.rounds[e.last]; const s=sc(e.lastRec);
    e.pct=s.core.pct; e.aclsPct=s.acls?s.acls.pct:null; e.pass=s.pass;
    e.first=sc(e.rounds[e.ns[0]]); e.firstPct=e.first.core.pct;
    e.code=e.pass?'pass':e.last>=FINAL_ROUND?'failed':e.last===1?'need2':'need3';
    e.kpi=e.pass?(e.last===1?5:e.last===2?4:3):(e.last>=FINAL_ROUND?2:(closed?(e.last===1?1:2):null));
    e.staff=e.recs.reduce((s,r)=>s+(parseInt(r.staffCount,10)||0),0);
  }
  return m;
}

function barChart(o){
  const W=o.w||720,H=o.h||260,L=40,R=12,T=22,B=o.b||46, pw=W-L-R, ph=H-T-B, max=o.max||100, cats=o.cats, ser=o.series;

  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'chart')+'">';
  for(let g=0;g<=max;g+=max/5){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="#E8EDF4"/><text x="'+(L-6)+'" y="'+(y(g)+4)+'" font-size="11" text-anchor="end" fill="#94A3B8">'+g+(o.unit||'')+'</text>'; }
  if(o.target!=null){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(o.target)+'" y2="'+y(o.target)+'" stroke="#D7262E" stroke-dasharray="5 4" stroke-width="1.3"/>'; }
  cats.forEach((c,i)=>{
    const x0=L+band*i+(band-bw*ser.length)/2;
    ser.forEach((se,j)=>{ const v=se.vals[i]; if(v==null) return; const x=x0+j*bw, yy=y(v), h=T+ph-yy;
      s+='<rect x="'+(x+1)+'" y="'+yy+'" width="'+(bw-2)+'" height="'+Math.max(h,0)+'" rx="3" fill="'+se.color+'"><title>'+esc(c+' · '+se.name+': '+Math.round(v)+(o.unit||''))+'</title></rect>';
      if(bw>=16) s+='<text x="'+(x+bw/2)+'" y="'+(yy-4)+'" font-size="'+(bw>=24?11:9.5)+'" text-anchor="middle" fill="#334155" font-weight="700">'+Math.round(v)+'</text>'; });
    const lines=String(c).split('\n');
    lines.forEach((ln,li)=>{ s+='<text x="'+(L+band*i+band/2)+'" y="'+(T+ph+16+li*13)+'" font-size="12" text-anchor="middle" fill="#334155">'+esc(ln)+'</text>'; });
  });
  return s+'</svg>';
}
function lineChart(o){

  const x=i=>L+pw*(n===1?.5:i/(n-1)), y=v=>T+ph*(1-Math.min(v,max)/max);

  o.series.forEach(se=>{

function unitMatrix(k,recs){
  const yr=recs.some(r=>rYear(r)===S.year)?S.year:rYear(recs[0]);
  const e=unitMap(recs.filter(r=>rYear(r)===yr))[k]; if(!e) return '';
  const rs=e.ns.map(n=>e.rounds[n]).filter(hasItems); if(!rs.length) return '';
  const items=CORE_ITEMS.concat(rs.some(r=>r.acls)?ACLS_ITEMS:[]);
  const cell=a=>a==='pass'?'<span style="color:#15803D;font-weight:800">✔</span>':a==='fail'?'<span style="color:#B91C1C;font-weight:800">✖</span>':a==='na'?'<span class="muted">N/A</span>':'<span class="muted">–</span>';
  let up=0,down=0,still=0,keep=0;

function cmpPairs(units){
  const m=S.cmpMode;
  return units.map(u=>{ let a=null,b=null;
    if(m==='12'){ a=u.rounds[1]; b=u.rounds[2]; } else if(m==='23'){ a=u.rounds[2]; b=u.rounds[3]; } else if(u.ns.length>1){ a=u.rounds[u.ns[0]]; b=u.lastRec; }
    return a&&b&&hasItems(a)&&hasItems(b)?{u,a,b,c:compareRecs(a,b)}:null; }).filter(Boolean);
}
function itemStatusOf(c,to){
  if(c.down.length&&c.down.length>=c.up.length) return ['↓ ถดถอย','b-fail'];
  if(c.down.length) return ['↕ ดีขึ้น แต่มีถดถอย','b-warn'];
  if(to!=null&&to>=80) return ['✓ ได้มาตรฐาน','b-pass'];
  if(c.up.length>c.still.length) return ['↑ ดีขึ้น','b-pass'];
  return ['⚠ ยังต้องพัฒนา','b-warn'];
}

   +'<div class="chips no-print" style="margin-bottom:12px">'+[['fl','ครั้งแรก → ครั้งล่าสุด'],['12','ครั้งที่ 1 → 2'],['23','ครั้งที่ 2 → 3']].map(x=>'<button class="chip'+(S.cmpMode===x[0]?' on':'')+'" data-cmpm="'+x[0]+'">'+x[1]+'</button>').join('')
   +'<span class="small muted" style="align-self:center;margin-left:8px">'+pairs.length+' หน่วยงานที่มีผลให้เทียบ</span></div>';

  const rt=[1,2,3].map(n=>{ const us=units.filter(u=>u.rounds[n]); const ps=us.filter(u=>sc(u.rounds[n]).pass).length;

  const agg=items=>items.map(it=>{ const c={up:[],keep:[],still:[],down:[]}; let fp=0,fn=0,tp=0,tn=0;

  const cards=pairs.map(x=>({x,d:sc(x.b).core.pct-sc(x.a).core.pct})).sort((a,b)=>b.d-a.d).map(({x,d})=>{ const u=x.u;
    const shown=S.cmpMode==='fl'?u.ns:S.cmpMode==='12'?[1,2]:[2,3];
    return '<div class="ucmp'+(u.pass?' ok':' ng')+'" data-unit="'+esc(u.k)+'"><div class="row" style="align-items:flex-start;gap:6px"><b style="flex:1">'+esc(u.name)+'</b>'+(u.pass?'<span class="badge b-pass">✔ ผ่านแล้ว</span>':'<span class="badge b-fail">✖ ยังไม่ผ่าน</span>')+'</div>'

function itemsPool(){

  if(S.itemsMode==='last') return Object.values(unitMap(pool)).map(u=>u.lastRec);
  return pool;
}
function itemStat(recs,k,acls){ let p=0,f=0,na=0; recs.forEach(r=>{ const a=acls?((r.acls||{}).scores||{})[k]:(r.scores||{})[k]; if(a==='pass')p++; else if(a==='fail')f++; else if(a==='na')na++; }); return {p,f,na,n:p+f,pct:p+f?p/(p+f)*100:null}; }

  h+='<div class="sec-h"><div><h2>ตารางรายข้อแยกกลุ่ม</h2></div></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c">ข้อ</th><th>รายการ</th><th class="c">★</th><th class="c">รวม</th>'+G.map(g=>'<th class="c">'+g+'</th>').join('')+'<th class="num">N/A</th></tr></thead><tbody>';

function flatRows(rows){
  return rows.map(r=>{ const s=sc(r), o={
    'วันที่':r.date||'','เวลา':r.time||'','ปี (พ.ศ.)':rYear(r)?BE(rYear(r)):'','หน่วยงาน':r.ward||'','กลุ่ม':unitGroup(r.ward),'Setting':unitSetting(r.ward)?SETTINGS[unitSetting(r.ward)]:'',
    'กลุ่มรายงาน':scopeOf(r)==='EXTRA'?'นอกสังกัด':'NSO','ครั้งที่':rRound(r),'ผู้ประเมิน':assessorText(r),'บุคลากร':r.staffCount||'',
    'Core คะแนน':s.core.e,'Core เต็ม':s.core.m,'Core %':s.core.pct,'Core ผล':s.corePass?'ผ่าน':'ไม่ผ่าน'};
    [1,2,3,4,5].forEach(d=>{ const x=s.core.doms[d]||{e:0,m:0}; o[CORE_DOMAINS[d].code+' %']=x.m?Math.round(x.e/x.m*100):''; });
    o['ACLS %']=s.acls?s.acls.pct:''; o['ACLS ผล']=s.acls?(s.aclsPass?'ผ่าน':'ไม่ผ่าน'):''; o['ผลรวม']=s.pass?'ผ่าน':'ไม่ผ่าน';
    o['Scenario']=r.scenario||''; const t=r.times||{}; o['เริ่มกด (วินาที)']=t.cpr==null?'':t.cpr; o['Shock แรก (วินาที)']=t.shock==null?'':t.shock; o['IV/IO (วินาที)']=t.iv==null?'':t.iv; o['Epi แรก (วินาที)']=t.epi==null?'':t.epi; o['CCF %']=t.ccf==null?'':t.ccf;
    o['Critical ที่พลาด']=s.core.crit.map(k=>CORE_BY[k].no).concat(s.acls?s.acls.crit:[]).join(', ');
    EXTRA_CHECKS.forEach(c=>{ o[c.short]=((r.extraChecks||{})[c.key]||{}).status||''; });
    o['วันนัดซ่อม']=r.remedialDate||''; o['หมายเหตุ']=((r.remarks||{}).overall)||''; o['แผนพัฒนา']=((r.remarks||{}).plan)||'';
    o['ข้อแนะนำรายข้อ']=itemsFor(r).filter(it=>ansOf(r,it.k)==='fail').map(it=>it.no+': '+adviceOrDefault(r,it.k)).join(' | ');
    const pv=hasItems(r)?prevRec(r):null, cp=pv?compareRecs(pv,r):null; o['ติดตาม: แก้ไขได้']=cp?cp.up.length+'/'+(cp.up.length+cp.still.length):''; o['ติดตาม: ถดถอย']=cp?cp.down.map(k=>itemOf(k).no).join(', '):'';
    const mark=a=>a==='pass'?4:a==='fail'?0:a==='na'?'N/A':'';
    CORE_ITEMS.forEach(it=>{ o[it.no+' '+it.s]=mark((r.scores||{})[it.k]); });
    ACLS_ITEMS.forEach(it=>{ o['ACLS '+it.no+' '+it.s]=s.acls?mark(r.acls.scores[it.k]):''; });
    return o; });
}

function exportCSV(){ const rows=flatRows(dataRows()); if(!rows.length){ toast('ไม่มีข้อมูล'); return; }
  const cols=Object.keys(rows[0]); const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  dl(new Blob(['﻿'+cols.map(q).join(',')+'\n'+rows.map(r=>cols.map(c=>q(r[c])).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),'Code8_'+BE(S.year)+'_'+isoDate(new Date())+'.csv'); }
function exportJSON(){ const all=S.all.map(cleanForCloud); dl(new Blob([JSON.stringify(all,null,1)],{type:'application/json'}),'Code8_Backup_ทุกปี_'+isoDate(new Date())+'.json'); toast('💾 สำรองข้อมูลทุกปี '+all.length+' รายการ'); }
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
async function exportXLSX(){
  const rows=dataRows(); if(!rows.length){ toast('ไม่มีข้อมูล'); return; }
  try{ if(!window.XLSX){ toast('⏳ กำลังเตรียมไฟล์ Excel…'); await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); } }
  catch(e){ toast('โหลดตัวสร้าง Excel ไม่ได้ — ส่งออกเป็น CSV แทน'); exportCSV(); return; }
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(flatRows(rows)),'ข้อมูลการซ้อม');
  const um=unitMap(poolYear());
  const st=Object.values(um).filter(u=>S.grp==='ALL'||u.group===S.grp).sort((a,b)=>a.group.localeCompare(b.group)||a.name.localeCompare(b.name)).map(u=>({'หน่วยงาน':u.name,'กลุ่ม':u.group,
    'ครั้งที่ 1 (%)':u.rounds[1]?sc(u.rounds[1]).core.pct:'-','ครั้งที่ 2 (%)':u.rounds[2]?sc(u.rounds[2]).core.pct:'-','ครั้งที่ 3 (%)':u.rounds[3]?sc(u.rounds[3]).core.pct:'-',
    'ACLS ล่าสุด (%)':u.aclsPct==null?'':u.aclsPct,'ผลการประเมิน':u.pass?'ผ่าน':'ไม่ผ่าน','สถานะ':ST[u.code][0],'KPI Score':u.kpi==null?'ระหว่างซ่อม':u.kpi}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(st),'สถานะ & KPI Score');
  const R=rows.filter(r=>rRound(r)===1);
  const it=CORE_ITEMS.map(i=>{ const o={'ข้อ':i.no,'รายการ':i.t,'Critical':i.c?'★':''}; const a=itemStat(R,i.k); o['รวม % ผ่าน (ครั้งที่ 1)']=a.pct==null?'':Math.round(a.pct);
    GROUPS.forEach(g=>{ const x=itemStat(R.filter(r=>unitGroup(r.ward)===g),i.k); o[g+' %']=x.pct==null?'':Math.round(x.pct); }); o['N/A']=a.na; return o; });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(it),'รายข้อ Core (ครั้งที่ 1)');
  XLSX.writeFile(wb,'Code8_'+BE(S.year)+'_'+isoDate(new Date())+'.xlsx');
}
$('#fileImport').addEventListener('change',async e=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length) return;
  let recs=[],bad=[];
  for(const f of files){ try{ const j=JSON.parse(await f.text()); const arr=Array.isArray(j)?j:(j.records||j.history||j.data||[]); arr.forEach(r=>{ if(r&&r.ward&&r.date) recs.push(r); }); }catch(err){ bad.push(f.name); } }
  const key=r=>String(r.id||'')||(wkey(r.ward)+'|'+r.date+'|'+(r.time||''));
  const have=new Set(S.all.map(key)), haveAlt=new Set(S.all.map(r=>wkey(r.ward)+'|'+r.date+'|'+(r.time||'')));
  const seen=new Set(); const fresh=recs.filter(r=>{ const k=key(r), k2=wkey(r.ward)+'|'+r.date+'|'+(r.time||''); if(have.has(k)||haveAlt.has(k2)||seen.has(k2)) return false; seen.add(k2); return true; });
  window._imp=fresh;
  openModal('⬆ นำเข้าข้อมูล JSON','<p>อ่านได้ <b>'+recs.length+'</b> รายการ จาก '+files.length+' ไฟล์ · <b style="color:#15803D">ใหม่ '+fresh.length+'</b> · ซ้ำ (ข้าม) '+(recs.length-fresh.length)+(bad.length?' · <span class="crit">อ่านไม่ได้: '+esc(bad.join(', '))+'</span>':'')+'</p>'
    +(fresh.length?'<div class="tbl-wrap" style="max-height:300px"><table class="tbl"><thead><tr><th>วันที่</th><th>หน่วยงาน</th><th>ครั้งที่</th><th class="num">%</th></tr></thead><tbody>'+fresh.map(r=>'<tr><td>'+fmtDate(r.date)+'</td><td>'+esc(r.ward)+'</td><td>'+rRound(r)+'</td><td class="num">'+esc(r.pct)+'</td></tr>').join('')+'</tbody></table></div><p class="note small" style="margin-top:10px">ข้อมูลใหม่จะถูกบันทึกขึ้นฐานข้อมูลกลาง (Firestore) และทุกคนจะเห็นทันที</p>':''),
    fresh.length?'<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn pri" onclick="confirmImport()">✅ ยืนยันนำเข้า '+fresh.length+' รายการ</button>':'<button class="btn" onclick="closeModal()">ปิด</button>');
});
function confirmImport(){ const fr=window._imp||[]; fr.forEach((r,i)=>{ const o=cleanForCloud(r); if(!o.id) o.id=Date.now()+i; writeRec(o); }); closeModal(); toast('⬆ นำเข้า '+fr.length+' รายการ'); }

document.addEventListener('change',e=>{

  +'<h3>4. Scenario Bank (10 scenario · ทุกเรื่องเริ่มด้วย VF/pVT · แต่ละ setting มีทั้งแบบ Shockable ล้วน และ Shockable → Non-shockable)</h3><table><thead><tr><th style="width:62px">รหัส</th><th>Scenario</th><th>ลำดับเหตุการณ์ (สคริปต์มาตรฐาน)</th><th style="width:118px">Algorithm</th><th class="c" style="width:46px">ช็อก</th><th style="width:110px">ACLS B3</th></tr></thead><tbody>'
  +SCENARIOS.map(s=>'<tr><td style="white-space:nowrap"><b>'+s.k+'</b></td><td>'+esc(s.t)+'</td><td class="small">'+esc(s.path)+'</td><td class="small">'+algoOf(s)+'</td><td class="c">'+s.shocks+'</td><td class="small">'+(s.shocks>=3?'ประเมิน (Amiodarone/Lidocaine)':'N/A อัตโนมัติ')+'</td></tr>').join('')+'</tbody></table>'
  +'<h3>5. Core 28 ข้อ (ทุกหน่วยงาน) พร้อมการปรับใช้ใน Critical Care</h3>'+itemTable(CORE_ITEMS,CORE_DOMAINS,true)
  +'<h3>6. ACLS Module '+ACLS_N+' ข้อ (เฉพาะ Critical Care)</h3><p class="note" style="margin:4px 0 8px">ขอบเขต: '+esc(ACLS_SCOPE)+(TRIAL_N?'<br><b>ข้อพิจารณา '+TRIAL_N+' ข้อ (A5 Pre-check, A6 Pre-charge)</b> — บันทึกผลได้และเลือก N/A ได้ แต่ยังไม่นับคะแนน เพื่อเก็บข้อมูลประกอบการพิจารณา · ILCOR อยู่ระหว่างทบทวนหลักฐานเรื่อง anticipatory charging (2025)':'')+'</p>'+itemTable(ACLS_ITEMS,ACLS_DOMAINS,false)
  +'<h3>7. เวลามาตรฐานที่บันทึก (จาก T0 = ผู้ป่วยหมดสติ)</h3><table><tbody><tr><th>เริ่มกดหน้าอก</th><td>เป้าหมาย ≤ 10 วินาทีหลังยืนยันว่าไม่มีชีพจร</td></tr><tr><th>Shock แรก</th><td>≤ 2 นาที (shockable rhythm)</td></tr><tr><th>IV / IO</th><td>≤ 5 นาที</td></tr><tr><th>Epinephrine แรก</th><td>VF/pVT หลังช็อกครั้งที่ 2 · PEA/Asystole ทันทีที่มีเส้น</td></tr><tr><th>CCF</th><td>≥ 80% จาก CPR feedback device</td></tr></tbody></table>'
  +'<h3>8. ขั้นตอนผู้ประเมิน</h3><table><thead><tr><th>ก่อนซ้อม</th><th>ระหว่างซ้อม</th><th>หลังซ้อม (Debriefing)</th></tr></thead><tbody><tr><td class="small">• เลือก scenario ตามตารางหมุนเวียน<br>• ทบทวนข้อ ★ Critical และ N/A อัตโนมัติ<br>• เตรียม CPR feedback device และนาฬิกาจับเวลา<br>• ตกลง T0 กับผู้ประเมินร่วม</td><td class="small">• บันทึกทันที ไม่รอจำ<br>• จับเวลาตามข้อ 7<br>• ห้ามบอกใบ้<br>• ทำตามสคริปต์ scenario เดียวกันทุกหน่วย</td><td class="small">• Plus–Delta เริ่มจากจุดแข็ง<br>• ชี้แจงข้อ ★ ที่พลาดพร้อมเหตุผลทางคลินิก<br>• กำหนดวันซ้อมซ่อมทันทีถ้าไม่ผ่าน<br>• บันทึกผลลงระบบภายในวันเดียวกัน</td></tr></tbody></table>'
  +'<p class="small muted" style="margin-top:16px">จัดทำโดย ฝ่ายวิชาการพยาบาล และ Clinical Nurse Educator โรงพยาบาลกรุงเทพ สำนักงานใหญ่</p></div>';
  $('#p-guide').innerHTML=h;
}
function printGuide(){ printHTML('Checklist Code 8 Drill — Critical Care',$('#p-guide .guide').innerHTML.replace(/<div class="row no-print"[\s\S]*?<\/div>/,'')); }

/* ================================================================
   boot & routing
   ================================================================ */
const RENDER={overview:renderOverview,ccd:renderCCD,form:renderForm,units:renderUnits,compare:renderCompare,items:renderItems,data:renderData,guide:renderGuide};
function switchTab(k){ S.tab=k; saveUI(); $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===k)); $$('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+k)); renderTab(); window.scrollTo({top:0}); }
function renderTab(){ try{ RENDER[S.tab](); }catch(err){ console.error(err); $('#p-'+S.tab).innerHTML='<div class="card note warn">เกิดข้อผิดพลาดในการแสดงผล: '+esc(err.message)+'</div>'; } }
function fillYears(){ const ys=yearsAvail(); if(S.year==null||ys.indexOf(S.year)<0){ const withData=ys.filter(y=>S.all.some(r=>scopeOf(r)===S.scope&&rYear(r)===y)); S.year=withData[0]||ys[0]; }
  $('#selYear').innerHTML=ys.map(y=>'<option value="'+y+'"'+(y===S.year?' selected':'')+'>'+BE(y)+'</option>').join(''); }
function onData(){ fillYears(); setNet(); if(S.tab!=='form') renderTab(); else { const h=$('#fWardHint'); if(h) h.innerHTML=wardHint(); } }
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(b) switchTab(b.dataset.tab); });
$('#selYear').addEventListener('change',e=>{ S.year=+e.target.value; renderTab(); });
$('#segScope').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; S.scope=b.dataset.v; saveUI(); $$('#segScope button').forEach(x=>x.classList.toggle('on',x===b)); S.year=null; fillYears(); renderTab(); });
$('#net').addEventListener('click',()=>flushQueue(true));
window.addEventListener('online',()=>{ setNet(); flushQueue(false); }); window.addEventListener('offline',setNet);
setInterval(()=>{ if(navigator.onLine&&lsGet(LS.queue,[]).length) flushQueue(false); },60000);
(function boot(){
  $('#fv').textContent=FORM_VERSION;
  $$('#segScope button').forEach(x=>x.classList.toggle('on',x.dataset.v===S.scope));
  const c=lsGet(LS.cache,null); if(c&&c.recs){ S.all=c.recs; overlayQueue(); }
  newForm(); fillYears(); setNet(); switchTab(RENDER[S.tab]?S.tab:'overview');
  initFB();
})();
</script>
